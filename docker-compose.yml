version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: biosentra_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biosentra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - biosentra_network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: biosentra_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/biosentra
      - SECRET_KEY=biosentra-super-secret-key-change-in-prod-123456789
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - db
    networks:
      - biosentra_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biosentra_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - biosentra_network

volumes:
  postgres_data:

networks:
  biosentra_network:
    driver: bridge
